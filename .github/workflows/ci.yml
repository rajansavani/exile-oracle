name: CI

# run on every push to any branch and every pull request targeting main
on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        env:
          # use placeholder values for secrets since these tests should not make real API calls
          OPENAI_API_KEY: ci-placeholder
          PINECONE_API_KEY: ci-placeholder
        run: pytest -v

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        # verify Dockerfile is valid and can build successfully
        # don't push to registry since this is just a CI check
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: exile-oracle:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
